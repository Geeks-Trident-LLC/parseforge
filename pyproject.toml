[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parseforge"
version = "0.2.0"
description = "LLM-driven pipeline that forges, validates, and promotes TextFSM templates from network CLI output"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

maintainers = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "textfsm>=1.1.0",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing",
    "Topic :: Utilities",

    "Operating System :: OS Independent",
]

keywords = [
    "textfsm",
    "network automation",
    "cli parsing",
    "template generator",
    "ai",
    "llm",
    "netmiko",
    "device output parsing",
]

[project.optional-dependencies]
sampling = ["netmiko>=4.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[project.scripts]
parseforge = "parseforge.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["parseforge*"]
exclude = ["tests*", "store*"]

[tool.pytest.ini_options]
addopts = "-ra --cov=parseforge --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
# Raise as stub modules (sampling/generation/validation/promotion/pipeline)
# get real implementations — see README.md.
fail_under = 0

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
