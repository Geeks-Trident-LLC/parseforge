[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parseforge"
version = "0.3.1"
description = "LLM-driven pipeline that forges, validates, and promotes TextFSM templates from network CLI output"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

maintainers = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "textfsm>=1.1.0",
    # textfsm-ai 0.7.0 removed cost/pricing estimation entirely
    # (textfsm_ai.core.pricing no longer exists) -- a deliberate,
    # permanent upstream change, not a bug. parseforge follows suit:
    # naming/providers/cost.py is gone and TokenUsage has no
    # estimated_cost field anywhere in this package either -- see
    # CHANGELOG.md.
    "textfsm-ai>=0.7.1",
    # anyask (same author/org as textfsm-ai) is the generic naming-side
    # LLM caller (see naming/providers/anyask_builder.py) -- unconditional
    # since the generic builder module imports it directly, unlike the 18
    # per-provider deferred-SDK-import files it replaced. anyask itself has
    # no heavy dependencies; it lazy-imports each provider SDK internally
    # (see its own anyask/registry.py), so this alone pulls in nothing
    # provider-specific.
    "anyask>=0.1.1",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing",
    "Topic :: Utilities",

    "Operating System :: OS Independent",
]

keywords = [
    "textfsm",
    "network automation",
    "cli parsing",
    "template generator",
    "ai",
    "llm",
    "netmiko",
    "device output parsing",
]

[project.optional-dependencies]
# Each extra pairs anyask's own per-provider extra (naming-side, lazy SDK
# import -- see naming/providers/anyask_builder.py) with textfsm-ai's
# matching extra (generation-side, a wholly separate code path unaffected
# by naming's anyask migration -- see generation.py). `pip install
# parseforge` alone installs no AI-provider SDK at all; add the extra(s)
# for the provider(s) you actually use.
anthropic = ["anyask[anthropic]>=0.1.1", "textfsm-ai[anthropic]>=0.7.1"]
deepseek = ["anyask[deepseek]>=0.1.1", "textfsm-ai[deepseek]>=0.7.1"]
openai = ["anyask[openai]>=0.1.1", "textfsm-ai[openai]>=0.7.1"]
groq = ["anyask[groq]>=0.1.1", "textfsm-ai[groq]>=0.7.1"]
xai = ["anyask[xai]>=0.1.1", "textfsm-ai[xai]>=0.7.1"]
together = ["anyask[together]>=0.1.1", "textfsm-ai[together]>=0.7.1"]
fireworks = ["anyask[fireworks]>=0.1.1", "textfsm-ai[fireworks]>=0.7.1"]
perplexity = ["anyask[perplexity]>=0.1.1", "textfsm-ai[perplexity]>=0.7.1"]
openrouter = ["anyask[openrouter]>=0.1.1", "textfsm-ai[openrouter]>=0.7.1"]
moonshot = ["anyask[moonshot]>=0.1.1", "textfsm-ai[moonshot]>=0.7.1"]
cerebras = ["anyask[cerebras]>=0.1.1", "textfsm-ai[cerebras]>=0.7.1"]
mistral = ["anyask[mistral]>=0.1.1", "textfsm-ai[mistral]>=0.7.1"]
cohere = ["anyask[cohere]>=0.1.1", "textfsm-ai[cohere]>=0.7.1"]
azure = ["anyask[azure]>=0.1.1", "textfsm-ai[azure]>=0.7.1"]
gemini = ["anyask[gemini]>=0.1.1", "textfsm-ai[gemini]>=0.7.1"]
# Same underlying google-genai package as gemini (Client(vertexai=True,
# project=, location=) vs. Client(api_key=)) -- kept as its own extra
# anyway, matching anyask's/textfsm-ai's own separate gemini/vertexai
# extras and the CLI's own --provider vertexai vs. gemini distinction.
vertexai = ["anyask[vertexai]>=0.1.1", "textfsm-ai[vertexai]>=0.7.1"]
bedrock = ["anyask[bedrock]>=0.1.1", "textfsm-ai[bedrock]>=0.7.1"]
# Much heavier than every other provider SDK here (~36MB) -- Oracle's
# single all-services SDK (compute, storage, IAM, ...), not a
# Generative-AI-only package (no such package exists on PyPI) -- plus
# the crypto libs (cryptography, pyOpenSSL) its request-signing auth
# model needs.
oci = ["anyask[oci]>=0.1.1", "textfsm-ai[oci]>=0.7.1"]
sampling = ["netmiko>=4.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    # Every provider's raw SDK is optional at runtime (see the extras
    # above), but every provider is exercised by the CLI/tests, which
    # should never silently skip -- so dev always pulls all of them in via
    # anyask's own `all` extra (every raw SDK anyask itself can wrap).
    "anyask[all]>=0.1.1",
]
# Tooling for scripts/release.ps1 and CI's own package-build step.
# bump2version isn't otherwise installed anywhere -- release.ps1 assumes
# it's already on PATH. twine is deliberately not here: the actual PyPI
# publish goes through pypa/gh-action-pypi-publish, not `twine upload`.
release = [
    "bump2version",
    "build",
]

[project.scripts]
parseforge = "parseforge.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["parseforge*"]
exclude = ["tests*", "store*"]

[tool.pytest.ini_options]
addopts = "-ra --cov=parseforge --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real: marks tests that require real API calls or external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:google\\.genai\\.",
    "ignore::DeprecationWarning:cohere\\.",
]

[tool.coverage.report]
# Raise as stub modules (sampling/generation/validation/promotion/pipeline)
# get real implementations — see README.md.
fail_under = 0

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
