[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parseforge"
version = "0.2.3"
description = "LLM-driven pipeline that forges, validates, and promotes TextFSM templates from network CLI output"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

maintainers = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "textfsm>=1.1.0",
    "openai>=1.0.0",
    "textfsm-ai>=0.6.1",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing",
    "Topic :: Utilities",

    "Operating System :: OS Independent",
]

keywords = [
    "textfsm",
    "network automation",
    "cli parsing",
    "template generator",
    "ai",
    "llm",
    "netmiko",
    "device output parsing",
]

[project.optional-dependencies]
# textfsm-ai v0.6.0+ made every provider SDK an optional extra (lazy
# import; a clear ImportError only when that provider is actually used).
# parseforge mirrors that per-provider, starting with anthropic --
# openai/deepseek stays a hard base dependency until it gets the same
# treatment in a follow-up.
anthropic = ["anthropic>=0.40.0", "textfsm-ai[anthropic]>=0.6.1"]
sampling = ["netmiko>=4.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    # anthropic is optional at runtime (see the `anthropic` extra above),
    # but it's the CLI's default --provider and tests should exercise it,
    # not silently skip -- so dev always pulls it in.
    "anthropic>=0.40.0",
]

[project.scripts]
parseforge = "parseforge.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["parseforge*"]
exclude = ["tests*", "store*"]

[tool.pytest.ini_options]
addopts = "-ra --cov=parseforge --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real: marks tests that require real API calls or external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:google\\.genai\\.",
    "ignore::DeprecationWarning:cohere\\.",
]

[tool.coverage.report]
# Raise as stub modules (sampling/generation/validation/promotion/pipeline)
# get real implementations — see README.md.
fail_under = 0

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
