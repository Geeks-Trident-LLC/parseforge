[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parseforge"
version = "0.2.5"
description = "LLM-driven pipeline that forges, validates, and promotes TextFSM templates from network CLI output"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

maintainers = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "textfsm>=1.1.0",
    "textfsm-ai>=0.6.1",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing",
    "Topic :: Utilities",

    "Operating System :: OS Independent",
]

keywords = [
    "textfsm",
    "network automation",
    "cli parsing",
    "template generator",
    "ai",
    "llm",
    "netmiko",
    "device output parsing",
]

[project.optional-dependencies]
# textfsm-ai v0.6.0+ made every provider SDK an optional extra (lazy
# import; a clear ImportError only when that provider is actually used).
# parseforge mirrors that per-provider: `pip install parseforge` alone
# now installs no AI-provider SDK at all -- add the extra(s) for the
# provider(s) you actually use.
anthropic = ["anthropic>=0.40.0", "textfsm-ai[anthropic]>=0.6.1"]
deepseek = ["openai>=1.0.0", "textfsm-ai[deepseek]>=0.6.1"]
openai = ["openai>=1.0.0", "textfsm-ai[openai]>=0.6.1"]
groq = ["openai>=1.0.0", "textfsm-ai[groq]>=0.6.1"]
xai = ["openai>=1.0.0", "textfsm-ai[xai]>=0.6.1"]
together = ["openai>=1.0.0", "textfsm-ai[together]>=0.6.1"]
fireworks = ["openai>=1.0.0", "textfsm-ai[fireworks]>=0.6.1"]
sampling = ["netmiko>=4.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    # anthropic/openai are optional at runtime (see the extras above), but
    # both providers are exercised by the CLI/tests, which should never
    # silently skip -- so dev always pulls both in.
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]
# Tooling for scripts/release.ps1 and CI's own package-build step.
# bump2version isn't otherwise installed anywhere -- release.ps1 assumes
# it's already on PATH. twine is deliberately not here: the actual PyPI
# publish goes through pypa/gh-action-pypi-publish, not `twine upload`.
release = [
    "bump2version",
    "build",
]

[project.scripts]
parseforge = "parseforge.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["parseforge*"]
exclude = ["tests*", "store*"]

[tool.pytest.ini_options]
addopts = "-ra --cov=parseforge --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real: marks tests that require real API calls or external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:google\\.genai\\.",
    "ignore::DeprecationWarning:cohere\\.",
]

[tool.coverage.report]
# Raise as stub modules (sampling/generation/validation/promotion/pipeline)
# get real implementations — see README.md.
fail_under = 0

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
