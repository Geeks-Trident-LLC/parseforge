[tox]
envlist = py39, py312, format, lint, typecheck
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run tests with coverage
extras = dev
commands =
    pytest --cov=parseforge --cov-report=term --cov-report=html

[testenv:lint]
description = Ruff check -> Black check
skip_install = true
deps =
    ruff>=0.4.0
    black>=24.0.0
commands =
    ruff check .
    black . --check

[testenv:format]
description = Ruff fix -> Black fix
skip_install = true
deps =
    ruff>=0.4.0
    black>=24.0.0
commands =
    ruff check --fix .
    black .

[testenv:typecheck]
description = Run mypy type checking
deps =
    mypy>=1.10.0
commands =
    mypy parseforge
