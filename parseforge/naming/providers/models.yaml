# Default model ID per provider, used as the fallback DEFAULT_MODEL value
# in each provider's builder class (see models.py). Not a quality/speed
# opinion -- just "a real, working model ID for this provider" for
# callers that don't pass --model explicitly. Matches the flat shape of
# textfsm-ai's own model_catalog/providers.yaml.
anthropic: claude-haiku-4-5-20251001
deepseek: deepseek-v4-flash
openai: gpt-5.4-mini
groq: llama-3.1-8b-instant
xai: grok-3-mini
together: meta-llama/Llama-3.1-8B-Instruct-Turbo
fireworks: accounts/fireworks/models/llama-v3p1-8b-instruct
perplexity: sonar
openrouter: google/gemini-2.5-flash-lite
moonshot: moonshot-v1-8k
cerebras: llama3.1-8b
mistral: mistral-small-latest
cohere: command-light
gemini: gemini-2.5-flash
# Vertex AI serves the SAME Gemini model catalog as the native Gemini
# Developer API (see "gemini:" above) under identical model IDs -- just
# through GCP's separate enterprise billing, so it gets its own entry
# rather than sharing "gemini:"'s.
vertexai: gemini-2.5-flash
bedrock: anthropic.claude-haiku-4-5-v1:0
# Not a "cheap/fast" pick like every other provider's default -- it's
# the only OCI model ID confirmed against Oracle's own docs. Use
# `textfsm-ai list-models oci --latest` (requires real OCI credentials)
# for the live catalog.
oci: meta.llama-3.3-70b-instruct
