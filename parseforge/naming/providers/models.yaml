# Model registry — one place to update when a provider deprecates or adds a
# model, instead of hunting for a hardcoded string in provider code.
#
# default:    used when no --model is given
# supported:  currently usable model IDs
# deprecated: known expired/unsupported IDs, kept here for reference so
#             nobody has to rediscover "why did this stop working" from
#             a provider's changelog

anthropic:
  default: claude-haiku-4-5-20251001
  supported:
    - claude-haiku-4-5-20251001
    - claude-sonnet-5
    - claude-opus-4-8
    - claude-fable-5
  deprecated: []

deepseek:
  default: deepseek-v4-flash
  supported:
    - deepseek-v4-flash
    - deepseek-v4-pro
  deprecated: []

openai:
  default: gpt-5.4-mini
  supported:
    - gpt-5.4-mini
    - gpt-5.4
    - gpt-5.4-nano
    - gpt-5.5
  deprecated: []

groq:
  default: llama-3.1-8b-instant
  supported:
    - llama-3.1-8b-instant
    - llama-3.3-70b-versatile
    - gemma2-9b-it
    - qwen-2.5-32b
    - mixtral-8x7b-32768
    - deepseek-r1-distill-llama-70b
  deprecated: []

xai:
  default: grok-3-mini
  supported:
    - grok-3-mini
    - grok-3
    - grok-4
    - grok-2-vision-1212
  deprecated: []
