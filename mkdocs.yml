site_name: parseforge
site_url: https://geeks-trident-llc.github.io/parseforge/
repo_url: https://github.com/Geeks-Trident-LLC/parseforge
repo_name: Geeks-Trident-LLC/parseforge

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - toc.integrate
  palette:
    - scheme: default

plugins:
  - search

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Providers: guides/providers.md
      - CLI Guide: guides/cli.md
      - Python API: guides/python-api.md
  - API Reference: reference/api.md
  - Changelog: changelog.md
